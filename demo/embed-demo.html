<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>PanScience Assistant · Embed preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 44px 20px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #1c2942; background: #f4f6fb; }
      main { max-width: 820px; margin: 0 auto; }
      .eyebrow { color: #5271cf; font-size: 10px; font-weight: 800; letter-spacing: .14em; }
      h1 { margin: 9px 0; font-size: 27px; letter-spacing: -.04em; }
      p { color: #76839a; font-size: 13px; line-height: 1.65; }
      form { margin-top: 26px; padding: 19px; background: white; border: 1px solid #e5e9f1; border-radius: 14px; }
      label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 700; }
      textarea { display: block; width: 100%; min-height: 92px; padding: 11px; resize: vertical; border: 1px solid #dfe5ef; border-radius: 9px; font: 11px/1.6 ui-monospace, monospace; color: #52617b; }
      button { margin-top: 10px; padding: 11px 15px; border: 0; border-radius: 9px; background: #456bdb; color: white; font-weight: 700; font-size: 11px; cursor: pointer; }
      .message { min-height: 20px; font-size: 11px; }
      .message.error { color: #a84447; }
      .frame-shell { padding: 10px; border: 1px solid #e4e8f0; border-radius: 14px; background: white; box-shadow: 0 18px 45px #27375b0b; }
      iframe { display: block; width: 100%; min-height: 560px; border: 0; border-radius: 8px; }
      @media (max-width: 600px) { body { padding: 26px 12px; } h1 { font-size: 23px; } .frame-shell { padding: 4px; } iframe { min-height: 650px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">EXTERNAL WEBSITE PREVIEW</div>
      <h1>Try the assistant embed</h1>
      <p>Copy the iframe snippet from your PanScience dashboard and paste it below. This demo creates the iframe locally and contains no assistant token or organization secret.</p>
      <form id="embed-form">
        <label for="snippet">Assistant embed code</label>
        <textarea id="snippet" required placeholder="Paste the generated &lt;iframe …&gt; code here"></textarea>
        <button type="submit">Load assistant preview ↗</button>
        <div class="message" id="message" role="status"></div>
      </form>
      <section class="frame-shell" id="frame-shell" hidden aria-label="Embedded assistant preview"></section>
    </main>
    <script>
      const form = document.querySelector("#embed-form");
      const input = document.querySelector("#snippet");
      const message = document.querySelector("#message");
      const shell = document.querySelector("#frame-shell");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        message.textContent = "";
        message.classList.remove("error");
        const parsed = new DOMParser().parseFromString(input.value, "text/html");
        const source = parsed.querySelector("iframe")?.getAttribute("src");
        let url;
        try { url = new URL(source); } catch { url = null; }
        if (!url || !["http:", "https:"].includes(url.protocol) || url.pathname !== "/assistant" || !url.searchParams.get("assistant_token")) {
          message.textContent = "Paste the iframe snippet generated by your dashboard. Its assistant URL could not be verified.";
          message.classList.add("error");
          return;
        }
        const iframe = document.createElement("iframe");
        iframe.src = url.href;
        iframe.title = "Organization assistant";
        iframe.loading = "lazy";
        iframe.referrerPolicy = "no-referrer";
        shell.replaceChildren(iframe);
        shell.hidden = false;
        message.textContent = "Assistant preview loaded.";
      });
    </script>
  </body>
</html>
